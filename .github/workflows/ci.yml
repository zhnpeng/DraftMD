name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: macOS checks
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DRAFTMD_FOUNDATION_STARTUP_BASELINE_MS: '900'
      DRAFTMD_LARGE_DOCUMENT_EDIT_BUDGET_MS: '2000'
      DRAFTMD_LARGE_DOCUMENT_LONG_TASK_BUDGET_MS: '3000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Integration tests
        run: npm run test:integration
      - name: Security tests
        run: npm run test:security
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload README workflow screenshots
        uses: actions/upload-artifact@v4
        with:
          name: draftmd-readme-screenshots
          path: test-results/readme-demo-*/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Performance tests
        run: npm run test:performance
      - name: Build
        run: npm run build
      - name: Check theme colors
        run: npm run check:theme-colors
      - name: Check whitespace
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CHANGE_BASE" ] && git cat-file -e "${CHANGE_BASE}^{commit}" 2>/dev/null; then
            git diff --check "$CHANGE_BASE" HEAD
          else
            git show --format= --check HEAD
          fi
          git diff --check
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: draftmd-ci-diagnostics
          path: |
            test-results/
            playwright-report/
            artifacts/performance/
          retention-days: 7
          if-no-files-found: ignore
