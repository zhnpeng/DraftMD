name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      DRAFTMD_FOUNDATION_STARTUP_BASELINE_MS: '900'
      DRAFTMD_LARGE_DOCUMENT_EDIT_BUDGET_MS: '2000'
      DRAFTMD_LARGE_DOCUMENT_LONG_TASK_BUDGET_MS: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Integration tests
        run: npm run test:integration
      - name: Security tests
        run: npm run test:security
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Performance tests
        run: npm run test:performance
      - name: Build
        run: npm run build
      - name: Check theme colors
        run: npm run check:theme-colors
      - name: Check whitespace
        run: git diff --check
      - name: Build unsigned Universal distributables
        run: CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac
      - name: Verify Universal candidate
        run: npm run verify:universal
      - name: Packaged acceptance tests
        run: npm run test:packaged
        env:
          DRAFTMD_PACKAGED_APP: ${{ github.workspace }}/release/mac-universal/DraftMD.app
      - uses: actions/upload-artifact@v4
        with:
          name: draftmd-macos-universal-unsigned
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
